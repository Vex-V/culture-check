[build-system]
requires = ["setuptools>=77"]          # 77: `license` as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "culturecheck"
version = "0.1.0"
description = "Shows which age groups a video's cultural cues reach, using Qloo's taste graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vidra/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart",
    "httpx>=0.27",
    # vidra's core (vendored in vidra/)
    "av>=15",
    "opencv-python>=5",
    "numpy>=2",
    "python-dotenv",
    "jsonschema",
    "openai",
    "supabase",
    # the soundtrack: what is said and sung (CTranslate2, no torch)
    "faster-whisper",
    # the upload connection
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
culturecheck = "culturecheck.__main__:main"

[tool.setuptools.packages.find]
include = ["culturecheck*", "vidra*"]

[tool.setuptools.package-data]
culturecheck = ["static/*"]
"vidra" = ["py.typed"]
"vidra.video_rag.core.describe" = ["prompts.json"]
"vidra.aggregates.definitions" = ["definitions.json"]
